
name: Nepali News Autopilot

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  generate-news-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install Nepali fonts and libraries
      - name: Install Nepali fonts and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-noto-core \
            fonts-noto-extra \
            libraqm-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libjpeg-dev \
            zlib1g-dev \
            libpng-dev \
            pkg-config

          sudo fc-cache -f -v

      # Install Python libraries
      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-binary=Pillow --force-reinstall Pillow

      # Check Font and RAQM
      - name: Check Nepali font and RAQM support
        shell: bash
        run: |
          python -c "
          from PIL import features
          print('RAQM:', features.check('raqm'))
          assert features.check('raqm'), 'RAQM is missing'
          "

          echo "Checking Devanagari fonts..."

          FONT_FILE=$(find /usr/share/fonts -type f \( -iname '*Devanagari*.ttf' -o -iname '*Devanagari*.otf' \) -print -quit)

          if [ -z "$FONT_FILE" ]; then
            echo "ERROR: Nepali font not found!"
            exit 1
          fi

          echo "Nepali font found: $FONT_FILE"

      # Collect news
      - name: Collect news
        run: python news.py

      # Check JSON file
      - name: Check news JSON
        run: |
          test -s news_candidates.json

          python -c "
          import json
          with open('news_candidates.json', encoding='utf-8') as f:
              data = json.load(f)
          assert isinstance(data, list), 'News JSON must be a list'
          print('Total news:', len(data))
          "

      # Generate news cards
      - name: Generate news cards
        run: python news_card.py

      # Check generated cards
      - name: Check generated cards
        run: |
          echo "Generated cards:"
          find news_cards -maxdepth 1 -type f -name "*.png" -print

          test -n "$(find news_cards -maxdepth 1 -type f -name '*.png' -print -quit)"

      # Save generated cards
      - name: Save generated cards
        uses: actions/upload-artifact@v4
        with:
          name: nepali-news-cards
          path: news_cards/*.png
          if-no-files-found: error
          retention-days: 7
