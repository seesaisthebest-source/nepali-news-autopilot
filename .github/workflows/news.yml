
name: Nepali News Autopilot

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  generate-news-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Nepali fonts and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-noto-core \
            fonts-noto-extra \
            libraqm-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libjpeg-dev \
            zlib1g-dev \
            libpng-dev \
            pkg-config

          sudo fc-cache -f -v

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-binary=Pillow Pillow
          pip install -r requirements.txt

      - name: Check Nepali font and RAQM support
        run: |
          python -c "from PIL import features; import os; print('RAQM:', features.check('raqm')); assert features.check('raqm'), 'RAQM is missing'; assert os.path.exists('/usr/share/fonts/truetype/noto/NotoSansDevanagari-Regular.ttf'), 'Nepali font is missing'"

      - name: Collect news
        run: python news.py

      - name: Check news file
        run: |
          test -s news_candidates.md
          echo "News candidates collected:"
          cat news_candidates.md

      - name: Generate news cards
        run: python news_card.py

      - name: Check generated cards
        run: |
          echo "Generated cards:"
          find news_cards -maxdepth 1 -type f -name "*.png" -print
          test -n "$(find news_cards -maxdepth 1 -type f -name '*.png' -print -quit)"

      - name: Save generated cards
        uses: actions/upload-artifact@v4
        with:
          name: nepali-news-cards
          path: news_cards/*.png
          if-no-files-found: error
          retention-days: 7
