
name: Nepali News Autopilot

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  generate-news-cards:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Install Nepali fonts and system libraries
      - name: Install Nepali fonts and system libraries
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            fonts-noto-core \
            fonts-noto-extra \
            libraqm-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libjpeg-dev \
            zlib1g-dev \
            libpng-dev \
            pkg-config

          sudo fc-cache -f -v

      # 4. Install Python requirements
      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

          # Build Pillow with RAQM support
          python -m pip install \
            --no-binary=Pillow \
            --force-reinstall Pillow

      # 5. Verify Nepali font and RAQM
      - name: Check Nepali font and RAQM support
        run: |
          python -c "
          from PIL import features
          print('RAQM:', features.check('raqm'))
          assert features.check('raqm'), 'RAQM is missing'
          "

          echo "Checking Devanagari fonts..."

          find /usr/share/fonts \
            -type f \
            \( -iname '*Devanagari*.ttf' -o -iname '*Devanagari*.otf' \)

          test -n "$(find /usr/share/fonts -type f \( -iname '*Devanagari*.ttf' -o -iname '*Devanagari*.otf' -print -quit)"

      # 6. Collect news
      - name: Collect news
        run: python news.py

      # 7. Verify JSON news file
      - name: Check news JSON
        run: |
          echo "Checking news_candidates.json..."

          test -s news_candidates.json

          echo "News JSON file found."

          python -c "
          import json
          with open('news_candidates.json', encoding='utf-8') as f:
              data = json.load(f)
          assert isinstance(data, list), 'News JSON must contain a list'
          print('Total news:', len(data))
          "

      # 8. Generate news cards
      - name: Generate news cards
        run: python news_card.py

      # 9. Verify generated cards
      - name: Check generated cards
        run: |
          echo "Generated news cards:"

          find news_cards \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            -print

          test -n "$(find news_cards -maxdepth 1 -type f -name '*.png' -print -quit)"

      # 10. Upload news cards
      - name: Save generated cards
        uses: actions/upload-artifact@v4
        with:
          name: nepali-news-cards
          path: news_cards/*.png
          if-no-files-found: error
          retention-days: 7
