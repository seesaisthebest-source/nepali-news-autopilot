
name: News Update Automation

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  generate-news-cards:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install system fonts and libraries
      - name: Install fonts and system libraries
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            fonts-noto-core \
            fonts-noto-extra \
            libraqm-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libjpeg-dev \
            zlib1g-dev \
            libpng-dev \
            pkg-config

          sudo fc-cache -f -v

      # 4. Install Python libraries
      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt

          python -m pip install \
            --no-binary=Pillow \
            --force-reinstall Pillow

      # 5. Check Nepali font and RAQM
      - name: Check fonts and RAQM
        run: |
          python - <<'PY'
          from PIL import features, ImageFont
          from pathlib import Path

          print("Checking RAQM support...")

          assert features.check("raqm"), "RAQM is missing"

          print("RAQM: ENABLED")

          print("Searching for Devanagari fonts...")

          directories = [
              Path("/usr/share/fonts"),
              Path("/usr/local/share/fonts"),
              Path("fonts"),
          ]

          fonts = []

          for directory in directories:
              if directory.exists():
                  fonts.extend(directory.rglob("*Devanagari*.ttf"))
                  fonts.extend(directory.rglob("*Devanagari*.otf"))

          fonts = list(dict.fromkeys(fonts))

          if not fonts:
              raise RuntimeError("Devanagari font not found")

          selected_font = None

          for path in fonts:
              try:
                  ImageFont.truetype(
                      str(path),
                      30,
                      layout_engine=ImageFont.Layout.RAQM
                  )
                  selected_font = path
                  break
              except Exception as error:
                  print("Skipping:", path, error)

          if selected_font is None:
              raise RuntimeError("No usable Devanagari font found")

          print("FONT CHECK SUCCESSFUL!")
          print("Selected font:", selected_font)
          PY

      # 6. Collect news
      - name: Collect news
        run: python news.py

      # 7. Check JSON news
      - name: Check news JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("news_candidates.json")

          if not path.exists():
              raise RuntimeError("news_candidates.json missing")

          if path.stat().st_size == 0:
              raise RuntimeError("News JSON is empty")

          with path.open(encoding="utf-8") as file:
              news = json.load(file)

          if not isinstance(news, list):
              raise RuntimeError("News JSON must contain a list")

          print("News collected:", len(news))
          PY

      # 8. Generate news cards
      - name: Generate news cards
        run: python news_card.py

      # 9. Verify generated cards
      - name: Check generated cards
        run: |
          python - <<'PY'
          from pathlib import Path

          output = Path("news_cards")

          if not output.exists():
              raise RuntimeError("News cards folder missing")

          cards = list(output.glob("*.png"))

          if not cards:
              raise RuntimeError("No news cards generated")

          print("Total cards generated:", len(cards))

          for card in cards:
              print("CARD:", card)
          PY

      # 10. Upload news cards
      - name: Save generated cards
        uses: actions/upload-artifact@v4
        with:
          name: news-update-cards
          path: news_cards/*.png
          if-no-files-found: error
          retention-days: 7
