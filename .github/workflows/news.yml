
name: Nepali News Autopilot

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  generate-news-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Nepali fonts and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-noto-core \
            libraqm-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libjpeg-dev \
            zlib1g-dev \
            libpng-dev \
            pkg-config

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-binary=Pillow Pillow
          pip install -r requirements.txt

      - name: Check Nepali font and RAQM support
        run: |
          python -c "from PIL import features; import os; print('RAQM:', features.check('raqm')); assert features.check('raqm'); assert os.path.exists('/usr/share/fonts/truetype/noto/NotoSansDevanagari-Regular.ttf')"

      - name: Collect news
        run: python news.py

      - name: Show collected news
        run: |
          echo "News candidates file:"
          ls -l news_candidates.md
          cat news_candidates.md

      - name: Generate news cards
        run: python news_card.py

      - name: Debug generated files
        if: always()
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "News candidates:"
          cat news_candidates.md || true
          echo "Generated cards:"
          find news_cards -maxdepth 1 -type f -name "*.png" -print || true

      - name: Save generated cards
        uses: actions/upload-artifact@v4
        with:
          name: nepali-news-cards
          path: news_cards/*.png
          if-no-files-found: error
          retention-days: 7
